name: Native platform test and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/app.js
      - run: node tests/test_frontend_research.cjs

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest pyinstaller
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python scripts/build.py
      - run: python scripts/smoke_package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traffic-accessibility-${{ matrix.os }}
          path: |
            dist/
            test-results.xml
