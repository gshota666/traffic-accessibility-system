name: Native platform test and build
on:
  push:
    branches-ignore: ['windows-release-*']
  pull_request:
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest pyinstaller
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python scripts/build.py
      - run: python scripts/smoke_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: traffic-accessibility-${{ matrix.os }}
          path: |
            dist/
            test-results.xml
